# Minimal configuration used only by the kit-aware smoke tests.
EVscope_PATH="$(cd -P "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd -P)"
CORE_PYTHON_ENV=""
STAR_INDEX="${EVscope_PATH}/tests/smoke/data"
STAR_COMMON_ARGS=(
  --readFilesCommand zcat
  --outFilterMultimapNmax 100
  --winAnchorMultimapNmax 100
  --outSAMtype BAM SortedByCoordinate
)
STAR_TOTAL_RNA_ARGS=(--twopassMode Basic --chimSegmentMin 10)
STAR_SMRNA_SE_ARGS=(
  --twopassMode None --alignEndsType EndToEnd --alignIntronMax 1
  --outFilterMismatchNmax 1 --outFilterMultimapScoreRange 0
  --outFilterScoreMinOverLread 0 --outFilterMatchNminOverLread 0
  --outFilterScoreMin 12 --outFilterMatchNmin 14
  --chimSegmentMin 10 --chimJunctionOverhangMin 10
  --chimScoreMin 1 --chimOutType Junctions WithinBAM
)
STAR_SMRNA_PE_ARGS=(
  --twopassMode None --alignEndsType EndToEnd --alignIntronMax 1
  --outFilterMismatchNmax 1 --outFilterMultimapScoreRange 0
  --outFilterScoreMinOverLread 0 --outFilterMatchNminOverLread 0
  --outFilterScoreMin 24 --outFilterMatchNmin 28
  --chimSegmentMin 10 --chimJunctionOverhangMin 10
  --chimScoreMin 1 --chimOutType Junctions WithinBAM
)
STAR_EXTRA_ARGS=(--mockGlobalInjected yes)
STAR_TOTAL_RNA_EXTRA_ARGS=()
STAR_SMRNA_EXTRA_ARGS=(--mockSmrnaInjected yes)
